<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Fiona的减肥记录仪</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4E9C96" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="减肥记录仪" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="topbarTitle">Fiona的减肥记录仪</span>
      <span id="topbarGear">⚙ 设置</span>
    </header>
    <main id="view"></main>
    <nav id="tabbar">
      <button class="tab active" data-tab="home"><span class="ico">🏠</span><span>首页</span></button>
      <button class="tab" data-tab="diet"><span class="ico">🍽️</span><span>饮食</span></button>
      <button class="tab" data-tab="weight"><span class="ico">⚖️</span><span>体重</span></button>
      <button class="tab" data-tab="exercise"><span class="ico">🏃</span><span>运动</span></button>
      <button class="tab" data-tab="plan"><span class="ico">📋</span><span>计划</span></button>
    </nav>
  </div>

  <div id="settingsOverlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- ===== 开屏 Splash（渐变动效 + 健康食物大碗 + 语音鼓励） ===== -->
  <div id="splash">
    <div class="splash-glow"></div>
    <div class="splash-inner">
      <div class="splash-bowl">
        <svg viewBox="0 0 300 250" role="img" aria-label="一碗健康食物：香蕉、鸡蛋、西红柿与蔬菜" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="150" cy="216" rx="86" ry="14" fill="rgba(0,0,0,.12)"/>
          <!-- 碗身 -->
          <path d="M48 150 Q150 268 252 150 Z" fill="#eaf5f2" stroke="#cfe7e0" stroke-width="3"/>
          <!-- 碗口 -->
          <ellipse cx="150" cy="150" rx="102" ry="26" fill="#ffffff" stroke="#4E9C96" stroke-width="6"/>
          <ellipse cx="150" cy="150" rx="86" ry="18" fill="#f4faf8"/>
          <!-- 蒸汽 -->
          <path class="steam s1" d="M128 96 q7 -10 0 -20 q-7 -10 0 -20" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round"/>
          <path class="steam s2" d="M172 90 q7 -10 0 -20 q-7 -10 0 -20" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round"/>
          <!-- 蔬菜叶（后中，无树干，多片带叶脉的绿叶菜） -->
          <g class="food f1">
            <path d="M150 138 C124 130 112 104 126 94 C140 86 150 110 150 138 Z" fill="#4caf50"/>
            <path d="M150 138 C176 130 188 104 174 94 C160 86 150 110 150 138 Z" fill="#5bbf5f"/>
            <path d="M150 140 C141 110 150 86 150 86 C150 86 159 110 150 140 Z" fill="#69cf6d"/>
            <path d="M150 134 L150 96" stroke="#3f8f4a" stroke-width="1.6" fill="none"/>
            <path d="M150 126 L132 108" stroke="#3f8f4a" stroke-width="1.2" fill="none"/>
            <path d="M150 126 L168 108" stroke="#3f8f4a" stroke-width="1.2" fill="none"/>
          </g>
          <!-- 西红柿（左） -->
          <g class="food f2">
            <circle cx="103" cy="140" r="24" fill="#ff6b5e"/>
            <circle cx="95" cy="132" r="7" fill="rgba(255,255,255,.45)"/>
            <path d="M103 118 q-9 -1 -11 -11 q11 0 13 9 q3 -11 13 -7 q-1 11 -15 9z" fill="#43a047"/>
          </g>
          <!-- 鸡蛋（右，煎蛋俯视） -->
          <g class="food f3">
            <path d="M176 132 q34 -4 38 18 q3 24 -20 28 q-34 4 -36 -20 q-2 -22 18 -26z" fill="#ffffff" stroke="#eef2f0" stroke-width="2"/>
            <circle cx="187" cy="150" r="11" fill="#ffc83d"/>
            <circle cx="183" cy="146" r="4" fill="#ffe08a"/>
          </g>
          <!-- 香蕉（前左） -->
          <g class="food f4">
            <path d="M70 176 q-30 0 -36 -30 q0 -14 13 -15 q9 -1 11 9 q3 20 26 28 q-9 8 -14 8z" fill="#ffd23f" stroke="#e3b800" stroke-width="2"/>
          </g>
          <!-- 绿叶菜（前右） -->
          <g class="food f5">
            <path d="M198 176 q24 -16 34 -4 q-12 16 -34 6z" fill="#5bbf5f"/>
            <path d="M190 184 q20 -6 34 6 q-16 12 -34 -2z" fill="#69cf6d"/>
          </g>
        </svg>
      </div>
      <h1 class="splash-title">Fiona的减肥记录仪</h1>
      <p class="splash-sub">均衡营养 · 适量而食 · 慢慢变瘦</p>
      <button id="splashEnter" class="splash-enter" type="button">进入 ▶</button>
      <div class="splash-progress"><i></i></div>
    </div>
  </div>

  <script src="js/sprite-data.js"></script>
  <script src="js/algo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/music.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
