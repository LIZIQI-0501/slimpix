<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Fiona的减肥记录仪</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4E9C96" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="减肥记录仪" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="topbarTitle">Fiona的减肥记录仪</span>
      <span id="topbarGear">⚙ 设置</span>
    </header>
    <main id="view"></main>
    <nav id="tabbar">
      <button class="tab active" data-tab="home"><span class="ico">🏠</span><span>首页</span></button>
      <button class="tab" data-tab="diet"><span class="ico">🍽️</span><span>饮食</span></button>
      <button class="tab" data-tab="weight"><span class="ico">⚖️</span><span>体重</span></button>
      <button class="tab" data-tab="plan"><span class="ico">📋</span><span>计划</span></button>
      <button class="tab" data-tab="analysis"><span class="ico">📊</span><span>分析</span></button>
    </nav>
  </div>

  <div id="settingsOverlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/sprite-data.js"></script>
  <script src="js/algo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
